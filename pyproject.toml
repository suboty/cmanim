[project]
name = "cmanim"
version = "0.1.0"
description = "A tiny library for creating animated compiler visualizations."
authors = [
    {name = "Nik Moroshkin",email = "seed.suboty@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "manim (==0.19.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
